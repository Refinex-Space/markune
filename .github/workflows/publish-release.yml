name: Publish Markune release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Markune tag and complete GitHub draft release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish draft
    runs-on: ubuntu-22.04
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate requested tag
        shell: bash
        env:
          MARKUNE_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$MARKUNE_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag must be vX.Y.Z SemVer"; exit 1; }
          TAG_SHA="$(git rev-parse --verify "refs/tags/${MARKUNE_RELEASE_TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$TAG_SHA" = "$HEAD_SHA" || { echo "::error::checked-out commit does not match requested tag"; exit 1; }
      - name: Verify complete cross-platform draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKUNE_RELEASE_TAG: ${{ inputs.tag }}
        run: GITHUB_REF_NAME="$MARKUNE_RELEASE_TAG" GITHUB_SHA="$(git rev-parse HEAD)" node scripts/verify-release-assets.mjs
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKUNE_RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$MARKUNE_RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
