name: Release Madora desktop

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/prepare-release-updater-config.mjs'
      - 'scripts/prepare-release-updater-config.test.mjs'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/app_update.rs'
      - 'components/workspace/__tests__/use-app-update.test.tsx'
      - 'components/workspace/__tests__/workspace-sidebar-update.test.tsx'
      - 'components/workspace/__tests__/workspace-settings-page.test.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Stage Tauri sidecars required by Cargo
        run: pnpm codex:stage && pnpm document-export:stage
      - name: Verify release configuration
        run: pnpm release:prepare
        env:
          MADORA_UPDATER_PUBLIC_KEY: ${{ vars.MADORA_UPDATER_PUBLIC_KEY }}
      - run: node --test scripts/prepare-release-updater-config.test.mjs
      - run: pnpm exec vitest run components/workspace/__tests__/use-app-update.test.tsx components/workspace/__tests__/workspace-sidebar-update.test.tsx components/workspace/__tests__/workspace-settings-page.test.tsx
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - name: Report Rust runner resources
        run: |
          nproc --all
          free --human
          df --human-readable .
      - name: Run Rust unit tests
        timeout-minutes: 45
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked --jobs 1

  publish:
    name: Build ${{ matrix.label }}
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            bundles: dmg
          - label: macOS Intel
            runner: macos-15-intel
            bundles: dmg
          - label: Windows x64
            runner: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Prepare signed updater configuration
        run: pnpm release:prepare
        env:
          MADORA_UPDATER_PUBLIC_KEY: ${{ vars.MADORA_UPDATER_PUBLIC_KEY }}
      - name: Validate release credentials
        shell: bash
        env:
          MADORA_RELEASES_TOKEN: ${{ secrets.MADORA_RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$MADORA_RELEASES_TOKEN" || { echo "::error::MADORA_RELEASES_TOKEN is required"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"; exit 1; }
      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MADORA_RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }} --config .tauri-build/tauri.release.generated.json
          generateReleaseNotes: false
          owner: Refinex-Space
          prerelease: false
          releaseAssetNamePattern: Madora_[arch][setup][ext]
          releaseBody: |
            Madora ${{ github.ref_name }} 安装包与自动更新资源。

            构建来源：私有 madora 仓库 commit `${{ github.sha }}`。

            正式发布前必须补充用户可见的更新说明并完成手册中的验收。
          releaseCommitish: main
          releaseDraft: true
          releaseName: Madora v__VERSION__
          repo: madora-site
          retryAttempts: 1
          tagName: v__VERSION__
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
