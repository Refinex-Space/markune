name: Release Madora desktop

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/promote-release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/prepare-release-updater-config.mjs'
      - 'scripts/prepare-release-updater-config.test.mjs'
      - 'scripts/print-oidc-claims.mjs'
      - 'scripts/print-oidc-claims.test.mjs'
      - 'scripts/promote-release-distribution.mjs'
      - 'scripts/release-distribution.mjs'
      - 'scripts/release-distribution.test.mjs'
      - 'scripts/verify-release-assets.mjs'
      - 'scripts/verify-release-assets.test.mjs'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/app_update.rs'
      - 'components/workspace/__tests__/use-app-update.test.tsx'
      - 'components/workspace/__tests__/workspace-sidebar-update.test.tsx'
      - 'components/workspace/__tests__/workspace-settings-page.test.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release configuration
        run: pnpm release:prepare
        env:
          MADORA_OSS_PUBLIC_BASE_URL: ${{ vars.MADORA_OSS_PUBLIC_BASE_URL }}
          MADORA_UPDATER_PUBLIC_KEY: ${{ vars.MADORA_UPDATER_PUBLIC_KEY }}
      - run: node --test scripts/prepare-release-updater-config.test.mjs scripts/release-distribution.test.mjs scripts/print-oidc-claims.test.mjs scripts/verify-release-assets.test.mjs
      - run: pnpm exec vitest run components/workspace/__tests__/use-app-update.test.tsx components/workspace/__tests__/workspace-sidebar-update.test.tsx components/workspace/__tests__/workspace-settings-page.test.tsx
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint

  publish:
    name: Build ${{ matrix.label }}
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            bundles: app,dmg
          - label: macOS Intel
            runner: macos-15-intel
            bundles: app,dmg
          - label: Windows x64
            runner: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Prepare signed updater configuration
        run: pnpm release:prepare
        env:
          MADORA_OSS_PUBLIC_BASE_URL: ${{ vars.MADORA_OSS_PUBLIC_BASE_URL }}
          MADORA_UPDATER_PUBLIC_KEY: ${{ vars.MADORA_UPDATER_PUBLIC_KEY }}
      - name: Validate release credentials
        shell: bash
        env:
          MADORA_RELEASES_TOKEN: ${{ secrets.MADORA_RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$MADORA_RELEASES_TOKEN" || { echo "::error::MADORA_RELEASES_TOKEN is required"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"; exit 1; }
      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MADORA_RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }} --config .tauri-build/tauri.release.generated.json
          generateReleaseNotes: false
          owner: Refinex-Space
          prerelease: false
          releaseAssetNamePattern: Madora_[arch][setup][ext]
          releaseBody: |
            ## Madora ${{ github.ref_name }}

            本版本包含功能改进、体验优化和问题修复。

            ### 支持平台

            - macOS Apple Silicon
            - macOS Intel
            - Windows x64

            ### 升级提示

            安装前请保存当前工作。Madora 不会静默下载或强制安装更新。
          releaseCommitish: main
          releaseDraft: true
          releaseName: Madora v__VERSION__
          repo: madora-site
          retryAttempts: 1
          tagName: v__VERSION__
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  verify_release:
    name: Verify draft release assets
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify complete cross-platform draft release
        run: node scripts/verify-release-assets.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.MADORA_RELEASES_TOKEN }}
