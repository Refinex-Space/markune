name: Release Markune desktop

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/publish-release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/prepare-release-updater-config.mjs'
      - 'scripts/prepare-release-updater-config.test.mjs'
      - 'scripts/release-distribution.mjs'
      - 'scripts/release-distribution.test.mjs'
      - 'scripts/verify-release-assets.mjs'
      - 'scripts/verify-release-assets.test.mjs'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/app_update.rs'
      - 'components/workspace/__tests__/use-app-update.test.tsx'
      - 'components/workspace/__tests__/workspace-sidebar-update.test.tsx'
      - 'components/workspace/__tests__/workspace-settings-page.test.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release configuration
        run: pnpm release:prepare
        env:
          MARKUNE_UPDATER_PUBLIC_KEY: ${{ vars.MARKUNE_UPDATER_PUBLIC_KEY }}
      - run: node --test scripts/prepare-release-updater-config.test.mjs scripts/release-distribution.test.mjs scripts/verify-release-assets.test.mjs
      - run: pnpm exec vitest run components/workspace/__tests__/use-app-update.test.tsx components/workspace/__tests__/workspace-sidebar-update.test.tsx components/workspace/__tests__/workspace-settings-page.test.tsx
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint

  publish:
    name: Build ${{ matrix.label }}
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            bundles: app,dmg
          - label: macOS Intel
            runner: macos-15-intel
            bundles: app,dmg
          - label: Windows x64
            runner: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Prepare signed updater configuration
        run: pnpm release:prepare
        env:
          MARKUNE_UPDATER_PUBLIC_KEY: ${{ vars.MARKUNE_UPDATER_PUBLIC_KEY }}
      - name: Validate updater signing credentials
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"; exit 1; }
      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }} --config .tauri-build/tauri.release.generated.json
          generateReleaseNotes: false
          prerelease: false
          releaseAssetNamePattern: Markune_[arch][setup][ext]
          releaseBody: |
            ## Markune v0.3.1

            搜索、图谱和来源跳转会等当前文档准备好再定位，加载过程中的旧请求不再抢滚动位置。

            ### 本次更新

            - **跳转等待文档就绪**：从搜索、图谱或来源打开位置时，Live 模式会等当前编辑器装载完成后再滚动。文档还在加载时不会提前定位。
            - **取消过期定位**：切换文档、切换源码模式或重新加载后，上一份文档的定位请求会被取消，不会覆盖当前光标。
            - **布局稳定后再核对位置**：定位后会等内容高度稳定；目标被挤出可视区域时只校正滚动。使用鼠标、滚轮或键盘时会停止这次自动定位。

            ### 支持平台

            - macOS Apple Silicon
            - macOS Intel
            - Windows x64

            ### 升级提示

            安装前请保存当前工作。Markune 不会静默下载或强制安装更新。

            ### 已知限制

            macOS 安装包使用 ad-hoc 签名，Windows 安装包暂未使用 Authenticode，首次安装时系统可能显示安全确认提示；自动更新包仍使用独立 minisign 签名校验。智能体以本机权限运行，可访问工作区并执行本地命令，请只安装信任的程序。
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          releaseName: Markune v__VERSION__
          tagName: v__VERSION__
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
