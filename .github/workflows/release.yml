name: Release Markune desktop

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/publish-release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/prepare-release-updater-config.mjs'
      - 'scripts/prepare-release-updater-config.test.mjs'
      - 'scripts/release-distribution.mjs'
      - 'scripts/release-distribution.test.mjs'
      - 'scripts/verify-release-assets.mjs'
      - 'scripts/verify-release-assets.test.mjs'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/app_update.rs'
      - 'components/workspace/__tests__/use-app-update.test.tsx'
      - 'components/workspace/__tests__/workspace-sidebar-update.test.tsx'
      - 'components/workspace/__tests__/workspace-settings-page.test.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release configuration
        run: pnpm release:prepare
        env:
          MARKUNE_UPDATER_PUBLIC_KEY: ${{ vars.MARKUNE_UPDATER_PUBLIC_KEY }}
      - run: node --test scripts/prepare-release-updater-config.test.mjs scripts/release-distribution.test.mjs scripts/verify-release-assets.test.mjs
      - run: pnpm exec vitest run components/workspace/__tests__/use-app-update.test.tsx components/workspace/__tests__/workspace-sidebar-update.test.tsx components/workspace/__tests__/workspace-settings-page.test.tsx
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint

  publish:
    name: Build ${{ matrix.label }}
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            bundles: app,dmg
          - label: macOS Intel
            runner: macos-15-intel
            bundles: app,dmg
          - label: Windows x64
            runner: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Prepare signed updater configuration
        run: pnpm release:prepare
        env:
          MARKUNE_UPDATER_PUBLIC_KEY: ${{ vars.MARKUNE_UPDATER_PUBLIC_KEY }}
      - name: Validate updater signing credentials
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"; exit 1; }
      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }} --config .tauri-build/tauri.release.generated.json
          generateReleaseNotes: false
          prerelease: false
          releaseAssetNamePattern: Markune_[arch][setup][ext]
          releaseBody: |
            ## Markune v0.2.5

            改进工作区同步、附件存储和文档保真，完善图谱与知识整理，并简化 Codex 问答和编辑体验。

            ### 本次更新

            - **外部修改自动同步**：改进工作区文件监听与刷新，支持刷新目录及其子目录；在文件树空白处可刷新或新建根目录文档、目录，外部修改与未保存草稿冲突时提供明确提示。
            - **附件保存位置可配置**：保留内置资产库作为默认位置，新增当前目录、assets、文档专属资源目录和指定路径；支持本地及网络图片处理规则、相对路径偏好与恢复默认值。
            - **保留文档元数据与链接**：改善 YAML 元数据兼容与保存保真，保留自定义字段、注释和原有格式；优化重命名、移动后的文档及附件引用更新。
            - **图谱关系更准确**：改进 Markdown、Wiki 链接、别名和锚点解析，减少代码等内容产生的错误关系，并支持外部变更后的图谱更新和未解析链接提示。
            - **新增知识整理与研究入口**：支持属性视图、任务视图、文档模板和更细致的搜索筛选，并提供文档关系、来源查看及 PDF 研究阅读入口。
            - **Codex 问答与编辑更直接**：统一输入框权限选择，移除独立文档预审流程；支持按请求问答或编辑，改善消息发送、历史任务恢复、工具执行反馈与回答渲染，修复工作区读取工具启动问题。
            - **修复图片列表与表格的编辑问题**：升级 Markweave 至 0.10.4，统一 Markdown 加载与更新逻辑，修复图片开头的列表及含图片表格在加载、保存和重开时的结构问题。

            ### 支持平台

            - macOS Apple Silicon
            - macOS Intel
            - Windows x64

            ### 升级提示

            安装前请保存当前工作。Markune 不会静默下载或强制安装更新。附件存储设置仅影响后续插入，不会自动迁移已有附件。

            ### 已知限制

            macOS 安装包使用 ad-hoc 签名，Windows 安装包暂未使用 Authenticode，首次安装时系统可能显示安全确认提示；自动更新包仍使用独立 minisign 签名校验。
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          releaseName: Markune v__VERSION__
          tagName: v__VERSION__
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
