name: Release Markune desktop

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/publish-release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/prepare-release-updater-config.mjs'
      - 'scripts/prepare-release-updater-config.test.mjs'
      - 'scripts/release-distribution.mjs'
      - 'scripts/release-distribution.test.mjs'
      - 'scripts/verify-release-assets.mjs'
      - 'scripts/verify-release-assets.test.mjs'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/app_update.rs'
      - 'components/workspace/__tests__/use-app-update.test.tsx'
      - 'components/workspace/__tests__/workspace-sidebar-update.test.tsx'
      - 'components/workspace/__tests__/workspace-settings-page.test.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release configuration
        run: pnpm release:prepare
        env:
          MARKUNE_UPDATER_PUBLIC_KEY: ${{ vars.MARKUNE_UPDATER_PUBLIC_KEY }}
      - run: node --test scripts/prepare-release-updater-config.test.mjs scripts/release-distribution.test.mjs scripts/verify-release-assets.test.mjs
      - run: pnpm exec vitest run components/workspace/__tests__/use-app-update.test.tsx components/workspace/__tests__/workspace-sidebar-update.test.tsx components/workspace/__tests__/workspace-settings-page.test.tsx
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint

  publish:
    name: Build ${{ matrix.label }}
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            bundles: app,dmg
          - label: macOS Intel
            runner: macos-15-intel
            bundles: app,dmg
          - label: Windows x64
            runner: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Prepare signed updater configuration
        run: pnpm release:prepare
        env:
          MARKUNE_UPDATER_PUBLIC_KEY: ${{ vars.MARKUNE_UPDATER_PUBLIC_KEY }}
      - name: Validate updater signing credentials
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"; exit 1; }
      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }} --config .tauri-build/tauri.release.generated.json
          generateReleaseNotes: false
          prerelease: false
          releaseAssetNamePattern: Markune_[arch][setup][ext]
          releaseBody: |
            ## Markune v0.2.9

            改进终端退出提示与会话清理，检查更新可走系统代理，并升级编辑器、整理工作区界面。

            ### 本次更新

            - **终端退出状态更明确**：进程退出后保留最后一屏并显示退出码，可直接新建标签。折叠面板不结束正在运行的命令；关闭最后一个标签不会立刻自动再建；切换工作区会结束旧终端。输出按完整字符显示，启动时不继承密钥型环境变量。
            - **检查更新支持代理**：更新检查和下载读取系统 HTTP(S) 代理，也支持进程中的 SOCKS 代理。切换系统代理后再次检查即可生效。
            - **编辑器升级到 Markweave 0.10.8**：改进本地 Markdown 链接解析。目录树按文件名显示并保留编号前缀；编辑器中的文档链接先打开预览。
            - **界面滚动与设置更稳**：页面根节点不再跟着引用浮层滚动。设置切换分类时内容回到顶部，可用 Escape 清空搜索。文档元信息面板和 Inbox 菜单的对齐与操作更整齐。

            ### 支持平台

            - macOS Apple Silicon
            - macOS Intel
            - Windows x64

            ### 升级提示

            安装前请保存当前工作。Markune 不会静默下载或强制安装更新。

            ### 已知限制

            macOS 安装包使用 ad-hoc 签名，Windows 安装包暂未使用 Authenticode，首次安装时系统可能显示安全确认提示；自动更新包仍使用独立 minisign 签名校验。
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          releaseName: Markune v__VERSION__
          tagName: v__VERSION__
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
