name: Release Markune desktop

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/publish-release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/prepare-release-updater-config.mjs'
      - 'scripts/prepare-release-updater-config.test.mjs'
      - 'scripts/release-distribution.mjs'
      - 'scripts/release-distribution.test.mjs'
      - 'scripts/verify-release-assets.mjs'
      - 'scripts/verify-release-assets.test.mjs'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/app_update.rs'
      - 'components/workspace/__tests__/use-app-update.test.tsx'
      - 'components/workspace/__tests__/workspace-sidebar-update.test.tsx'
      - 'components/workspace/__tests__/workspace-settings-page.test.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release configuration
        run: pnpm release:prepare
        env:
          MARKUNE_UPDATER_PUBLIC_KEY: ${{ vars.MARKUNE_UPDATER_PUBLIC_KEY }}
      - run: node --test scripts/prepare-release-updater-config.test.mjs scripts/release-distribution.test.mjs scripts/verify-release-assets.test.mjs
      - run: pnpm exec vitest run components/workspace/__tests__/use-app-update.test.tsx components/workspace/__tests__/workspace-sidebar-update.test.tsx components/workspace/__tests__/workspace-settings-page.test.tsx
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint

  publish:
    name: Build ${{ matrix.label }}
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            bundles: app,dmg
          - label: macOS Intel
            runner: macos-15-intel
            bundles: app,dmg
          - label: Windows x64
            runner: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Prepare signed updater configuration
        run: pnpm release:prepare
        env:
          MARKUNE_UPDATER_PUBLIC_KEY: ${{ vars.MARKUNE_UPDATER_PUBLIC_KEY }}
      - name: Validate updater signing credentials
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"; exit 1; }
      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }} --config .tauri-build/tauri.release.generated.json
          generateReleaseNotes: false
          prerelease: false
          releaseAssetNamePattern: Markune_[arch][setup][ext]
          releaseBody: |
            ## Markune v0.2.7

            改进工作区导航与界面，支持从系统打开 Markdown 文件，并修复视图页与编辑器拖拽条问题。

            ### 本次更新

            - **支持系统打开 Markdown**：安装后可在「打开方式」中选择 Markune 打开 `.md` / `.mdx`，不会抢占默认应用。从文件打开会进入对应工作区并选中该文档；应用已在运行时转到同一窗口。
            - **搜索与工作区切换并入侧栏**：将搜索和工作区切换放到侧栏系统入口和底栏，减少顶部入口分散。
            - **界面更贴齐窗口**：分栏卡片改为贴齐窗口的连续外壳，Git 面板和日志入口标明 Beta。
            - **修复视图页与编辑器拖拽**：统一视图页下拉并对齐分组表格；文档编辑器不再盖住左侧宽度拖拽条。

            ### 支持平台

            - macOS Apple Silicon
            - macOS Intel
            - Windows x64

            ### 升级提示

            安装前请保存当前工作。Markune 不会静默下载或强制安装更新。

            ### 已知限制

            macOS 安装包使用 ad-hoc 签名，Windows 安装包暂未使用 Authenticode，首次安装时系统可能显示安全确认提示；自动更新包仍使用独立 minisign 签名校验。
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          releaseName: Markune v__VERSION__
          tagName: v__VERSION__
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
