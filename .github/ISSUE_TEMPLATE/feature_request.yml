name: 功能建议
description: 提议一个符合本地 Markdown 工作区边界的能力
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述真实使用场景，而不是只描述界面或实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望流程、数据归属和关键边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和文档，未发现相同提议
          required: true
        - label: 我理解较大的功能需要先讨论范围再实现
          required: true
