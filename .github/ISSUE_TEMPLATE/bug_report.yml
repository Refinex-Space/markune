name: Bug 报告
description: 报告可复现的 Markune 功能异常
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢反馈。安全漏洞请使用仓库 Security 页面私密报告，不要在此披露。
  - type: input
    id: version
    attributes:
      label: Markune 版本
      placeholder: 例如 0.2.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows x64
        - Web 开发环境
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明实际结果、预期结果和影响。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先移除工作区内容、绝对路径、用户名、密钥和其他敏感信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题
          required: true
        - label: 此报告不包含安全漏洞或敏感数据
          required: true
